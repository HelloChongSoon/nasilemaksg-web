<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KampungSG - Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@650;750&family=Manrope:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="site-header">
        <div class="nav-inner">
          <a class="brand" href="./index.html"><img src="https://www.kampungsg.com/assets/kampung-house-icon-DYyTplxy.png" alt="KampungSG" /><span class="brand-text"><span>KampungSG</span><span>Lease Management</span></span></a>
          <nav class="nav-links" aria-label="Primary"><a href="./index.html">Back to Home</a><a href="./help.html">Help</a><a href="./faq.html">FAQ</a></nav>
          <button class="mobile-menu" type="button" data-menu>Menu</button>
        </div>
      </header>
      <main class="auth-wrap">
        <section class="auth-art">
          <div>
            <p class="kicker">Welcome Back</p>
            <h1>KampungSG</h1>
            <p class="lead">Sign in to your Singapore property lease management workspace.</p>
          </div>
        </section>
        <section class="auth-panel">
          <p class="kicker">Welcome Back</p>
          <h2>Sign in to your account</h2>
          <form class="form-stack">
            <label>Email<input class="input" type="email" placeholder="you@example.com" /></label>
            <label>Password<input class="input" type="password" placeholder="Password" /></label>
            <button class="button" type="button">Sign In</button>
            <button class="button secondary" type="button">Continue with Google</button>
          </form>
          <p style="color: var(--muted)">Don't have an account? Create one here.</p>
          <p style="color: var(--muted); font-size: 13px">By continuing, you agree to the Terms of Service and Privacy Policy.</p>
        </section>
      </main>
    </div>
    <script src="./app.js"></script>
  </body>
</html>
